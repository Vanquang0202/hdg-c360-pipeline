name: hdg-cdc
services:
  kafka:
    image: apache/kafka:3.8.1
    hostname: kafka
    ports:
      - "127.0.0.1:29092:29092"
    mem_limit: 1024m
    mem_reservation: 512m
    cpus: 1.0
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      KAFKA_NUM_PARTITIONS: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_RETENTION_HOURS: "168"
      KAFKA_LOG_RETENTION_BYTES: "536870912"
      KAFKA_LOG_SEGMENT_BYTES: "67108864"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      KAFKA_OPTS: "-XX:MaxDirectMemorySize=128m -XX:MaxMetaspaceSize=128m"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    networks: [hdg]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1"]
      interval: 20s
      timeout: 15s
      retries: 8
      start_period: 30s
    stop_grace_period: 60s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  connect:
    image: quay.io/debezium/connect:3.4.3.Final
    hostname: connect
    ports:
      - "127.0.0.1:8083:8083"
    mem_limit: 1408m
    mem_reservation: 768m
    cpus: 1.5
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: hdg-connect
      CONFIG_STORAGE_TOPIC: hdg-connect-configs
      OFFSET_STORAGE_TOPIC: hdg-connect-offsets
      STATUS_STORAGE_TOPIC: hdg-connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_PARTITIONS: "1"
      CONNECT_STATUS_STORAGE_PARTITIONS: "1"
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "true"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "true"
      REST_HOST_NAME: 0.0.0.0
      ADVERTISED_HOST_NAME: connect
      HEAP_OPTS: "-Xms256m -Xmx768m"
      KAFKA_OPTS: "-XX:MaxDirectMemorySize=128m -XX:MaxMetaspaceSize=256m"
      OFFSET_FLUSH_INTERVAL_MS: "10000"
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      ORACLE_CDC_PASSWORD: ${ORACLE_CDC_PASSWORD:?Set ORACLE_CDC_PASSWORD in cdc/.env or PowerShell}
    volumes:
      - type: bind
        source: ../jobs/jars/ojdbc11.jar
        target: /kafka/connect/debezium-connector-oracle/ojdbc11.jar
        read_only: true
        bind:
          create_host_path: false
    networks: [hdg]
    depends_on:
      kafka: {condition: service_healthy}
    stop_grace_period: 90s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

networks:
  hdg:
    external: true
    name: ${HDG_DOCKER_NETWORK:-hdg-cdc-net}
volumes:
  kafka_data:
