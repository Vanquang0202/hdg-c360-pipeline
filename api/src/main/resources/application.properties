spring.application.name=hdg-c360-api
spring.config.import=optional:file:api/.env[.properties],optional:file:.env[.properties]
server.address=127.0.0.1
server.port=8090
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
spring.datasource.url=jdbc:postgresql://127.0.0.1:${C360_API_PG_PORT:15432}/${C360_API_DATABASE:hdg_mirror}?connectTimeout=5
spring.datasource.username=${C360_API_DB_USER}
spring.datasource.password=${C360_API_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000
spring.jdbc.template.query-timeout=5s
spring.sql.init.mode=never
spring.jackson.serialization.write-dates-as-timestamps=false
server.tomcat.accesslog.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
logging.level.org.springframework.jdbc=ERROR
logging.level.com.zaxxer.hikari=ERROR
c360.cursor-secret=${C360_API_CURSOR_SECRET}
c360.audit.path=${C360_API_AUDIT_DIR:./test-results/c360-api/java-outbox}
c360.audit.delay=100
